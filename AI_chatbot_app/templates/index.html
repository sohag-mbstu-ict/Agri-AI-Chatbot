<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Word Autocomplete and querySuggestions</title>

  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
  <h2>Dr. Chashi AI Assistant</h2>

  <input
    type="text"
    id="searchBox"
    placeholder="Start typing..."
    autocomplete="off"
  />

  <!-- Word suggestions -->
  <div id="suggestions"></div>

  <!-- Query recommendations -->
  <div id="querySuggestions" class="query-box"></div>
  <!-- Answer output -->
  <div id="answerBox" class="answer-box"></div>


  <script src="{% static 'js/word_autocomplete.js' %}"></script>
</body>
</html>
